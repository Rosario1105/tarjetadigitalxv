<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Invitación digital interactiva para los XV de Cami Leiva.">

    <title>Mis XV | Cami Leiva</title>

    <link rel="stylesheet" href="./css/output.css">
</head>


<body class="bg-black text-white antialiased">


    <!--BIENVENIDA-->

    <section id="welcome" class="fixed inset-0 z-50 flex min-h-screen
           items-center justify-center
           bg-white px-6 text-black
           transition-all duration-700 ease-in-out">

        <div class="max-w-md text-center">

            <p class="font-sans text-xs uppercase
               tracking-[0.5em] text-black/50">
                Mis XV
            </p>

            <h1 class="mt-3 font-display text-7xl
               font-light sm:text-8xl">
                CAMI
            </h1>

            <p class="mx-auto mt-6 max-w-sm
               font-sans text-sm leading-7
               text-black/60">
                Quiero que formes parte de mi noche especial.
            </p>

            <button id="enter-button" type="button" class="mt-10 rounded-full bg-black
               px-8 py-4
               font-sans text-xs uppercase
               tracking-[0.25em] text-white
               transition duration-300
               hover:scale-105">
                Ingresar
            </button>

        </div>

    </section>


    <main>



        <section id="countdown" class="relative min-h-screen overflow-hidden bg-black">

        

            <img src="./assets/images/866c2dd12c0dba02c83008673f718950.jpg" alt=""
                class="absolute inset-0 h-full w-full object-cover">

      

            <div class="absolute inset-0 bg-black/40"></div>



            <div class="relative z-10 flex min-h-screen
               flex-col items-center justify-center
               px-6 py-20 text-center">

     

                <div class="text-center">

                    <p class="font-sans text-xs font-light
                   uppercase tracking-[0.65em]
                   text-white
                   drop-shadow-[0_2px_8px_rgba(0,0,0,1)]">
                        Mis XV
                    </p>

                    <h2 class="mt-2 font-display text-7xl
                   font-light leading-none text-white
                   drop-shadow-[0_3px_12px_rgba(0,0,0,0.9)]
                   sm:text-8xl md:text-9xl">
                        CAMI
                    </h2>

                </div>



                <div class="mt-12 flex w-full max-w-2xl
                 items-center justify-center
                 gap-3 text-center sm:gap-8" aria-label="Cuenta regresiva para el evento">

                    <div>
                        <span id="days" class="block font-display text-4xl
                     text-white drop-shadow-lg
                     sm:text-5xl">
                            00
                        </span>

                        <span class="mt-1 block font-sans
                     text-[9px] uppercase
                     tracking-[0.2em] text-white/80">
                            Días
                        </span>
                    </div>


                    <span class="mb-5 text-xl text-white/50">
                        ·
                    </span>




                    <div>
                        <span id="hours" class="block font-display text-4xl
                     text-white drop-shadow-lg
                     sm:text-5xl">
                            00
                        </span>

                        <span class="mt-1 block font-sans
                     text-[9px] uppercase
                     tracking-[0.2em] text-white/80">
                            Horas
                        </span>
                    </div>


                    <span class="mb-5 text-xl text-white/50">
                        ·
                    </span>



                    <div>
                        <span id="minutes" class="block font-display text-4xl
                     text-white drop-shadow-lg
                     sm:text-5xl">
                            00
                        </span>

                        <span class="mt-1 block font-sans
                     text-[9px] uppercase
                     tracking-[0.2em] text-white/80">
                            Min
                        </span>
                    </div>


                    <span class="mb-5 text-xl text-white/50">
                        ·
                    </span>




                    <div>
                        <span id="seconds" class="block font-display text-4xl
                     text-white drop-shadow-lg
                     sm:text-5xl">
                            00
                        </span>

                        <span class="mt-1 block font-sans
                     text-[9px] uppercase
                     tracking-[0.2em] text-white/80">
                            Seg
                        </span>
                    </div>

                </div>




            </div>

        </section>


        <!--CUANDO-->

        <section id="cuando" class="relative overflow-hidden
             bg-black px-6 py-28 text-white">

            <div class="mx-auto max-w-3xl text-center">

                <p class="font-sans text-xs uppercase
                 tracking-[0.6em] text-white/50">
                    ¿Cuándo?
                </p>

                <div class="mx-auto my-8 h-px w-16
                 bg-white/30"></div>

                <h2 class="font-display text-5xl
                 font-light sm:text-6xl">
                    03 de Octubre
                </h2>

                <p class="mt-3 font-display text-3xl
                 font-light text-white/70">
                    2026
                </p>

                <p class="mt-8 font-sans text-sm
                 uppercase tracking-[0.35em]
                 text-white/60">
                    22:00 hs
                </p>

            </div>

        </section>


    </main>




    <audio id="background-music" loop preload="metadata">
        <source src="./assets/audio/David Guetta Feat. Kid Cudi - Memories (Official Video) (1).mp3" type="audio/mpeg">
    </audio>


    <!-- BOTON AUDIO -->

    <button id="music-button" type="button" aria-label="Pausar música" class="fixed bottom-5 right-5 z-40
           hidden h-11 w-11
           items-center justify-center
           rounded-full
           border border-white/30
           bg-black/70 text-sm text-white
           backdrop-blur-sm
           transition duration-300
           hover:scale-110">
        ♪
    </button>




    <script src="./js/config.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>
