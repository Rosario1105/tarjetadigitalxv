<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Invitación digital interactiva para celebración de XV años.">

    <title>Mis XV | Cami Leiva </title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./css/output.css">
</head>

<body class="bg-black text-white antialiased">

    <!-- Pantalla de bienvenida -->
   <section
  id="welcome"
  class="fixed inset-0 z-50 flex min-h-screen items-center justify-center bg-white px-6 text-black transition-all duration-700 ease-in-out"
>
  <div class="max-w-md text-center">

    <p class="font-sans text-xs uppercase tracking-[0.5em] text-black/50">
      Mis XV
    </p>

    <h1 class="mt-3 font-display text-7xl font-light sm:text-8xl">
      CAMI
    </h1>

    <p class="mx-auto mt-6 max-w-sm font-sans text-sm leading-7 text-black/60">
      Quiero que formes parte de mi noche especial.
    </p>

    <button
      id="enter-button"
      type="button"
      class="mt-10 rounded-full bg-black px-8 py-4
             font-sans text-xs uppercase tracking-[0.25em] text-white
             transition duration-300 hover:scale-105"
    >
      Ingresar
    </button>

  </div>
</section>


    <!-- JavaScript -->
    <script src="./js/config.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>
