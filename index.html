<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Invitación digital interactiva para celebración de XV años.">

    <title>Mis XV | Invitación</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./css/output.css">
</head>

<body class="bg-black text-white antialiased">

    <main>

    
<section
  id="inicio"
  class="relative min-h-screen overflow-hidden bg-black"
>
  <!-- Fondo con gradientes -->
  <div class="absolute inset-0">
    <div
      class="absolute -left-20 top-20 h-72 w-72 rounded-full bg-fuchsia-500/25 blur-3xl"
    ></div>

    <div
      class="absolute right-0 bottom-24 h-96 w-96 rounded-full bg-violet-500/20 blur-3xl"
    ></div>

    <div
      class="absolute left-1/2 top-1/2 h-[500px] w-[500px] -translate-x-1/2 -translate-y-1/2 rounded-full border border-white/10"
    ></div>
  </div>

  <!-- Contenido -->
  <div
    class="relative z-10 flex min-h-screen flex-col items-center justify-center px-6 text-center"
  >
    <p
      class="mb-5 text-xs uppercase tracking-[0.7em] text-white/70"
    >
      Mis XV
    </p>

    <h1
      class="bg-gradient-to-b from-white via-white to-zinc-400 bg-clip-text text-7xl font-light text-transparent sm:text-8xl md:text-9xl"
    >
      Cami
    </h1>

    <div class="my-8 h-px w-28 bg-white/30"></div>

    <p
      class="text-sm tracking-[0.35em] text-white/80"
    >
      03 · OCTUBRE · 2026
    </p>

    <p
      class="mt-3 text-xs uppercase tracking-[0.4em] text-white/50"
    >
      Una noche inolvidable
    </p>

    <a
      href="#countdown"
      aria-label="Deslizar hacia abajo"
      class="group mt-16 flex h-14 w-14 items-center justify-center rounded-full border border-white/30 transition-all duration-300 hover:scale-110 hover:border-white hover:bg-white/10"
    >
      <span
        class="text-xl transition-transform duration-300 group-hover:translate-y-1"
      >
        ↓
      </span>
    </a>
  </div>
</section>


        <section
  id="countdown"
  class="flex min-h-screen items-center justify-center bg-zinc-950 px-6 py-20"
  aria-labelledby="countdown-title"
>
  <div class="w-full max-w-4xl text-center">

    <p class="mb-4 text-xs uppercase tracking-[0.6em] text-white/50">
      Falta muy poco
    </p>

    <h2
      id="countdown-title"
      class="text-3xl font-light sm:text-4xl"
    >
      Para una noche inolvidable
    </h2>

    <div
      class="mt-12 grid grid-cols-2 gap-4 sm:grid-cols-4"
      aria-label="Cuenta regresiva para el evento"
    >

      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <span id="days" class="block text-4xl font-light sm:text-5xl">
          00
        </span>

        <span class="mt-2 block text-xs uppercase tracking-[0.25em] text-white/50">
          Días
        </span>
      </div>

      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <span id="hours" class="block text-4xl font-light sm:text-5xl">
          00
        </span>

        <span class="mt-2 block text-xs uppercase tracking-[0.25em] text-white/50">
          Horas
        </span>
      </div>

      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <span id="minutes" class="block text-4xl font-light sm:text-5xl">
          00
        </span>

        <span class="mt-2 block text-xs uppercase tracking-[0.25em] text-white/50">
          Min
        </span>
      </div>

      <div class="rounded-2xl border border-white/10 bg-white/5 p-6">
        <span id="seconds" class="block text-4xl font-light sm:text-5xl">
          00
        </span>

        <span class="mt-2 block text-xs uppercase tracking-[0.25em] text-white/50">
          Seg
        </span>
      </div>

    </div>

  </div>
</section>

    </main>


    <!-- JavaScript -->
    <script src="./js/config.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>
